name: Update Lite List

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download, decode and filter list
        env:
          LIST_URL: ${{ secrets.LIST_URL }}
        run: |
          curl -sSfL "$LIST_URL" -o /tmp/list.txt

          python3 -c 'import base64; s=open("/tmp/list.txt","rb").read().strip(); open("filtered2.txt","wb").write(base64.b64decode(s+b"="*(-len(s)%4)))'
          cat filtered2.txt
          
          list="$(cat /tmp/list.txt)"
          list+="$(printf '=%.0s' $(seq 1 $(( (4 - ${#list} % 4) % 4 ))))"
          printf '%s' "$list" | base64 -d > filtered.txt

      - name: Set timestamp
        run: echo "TIMESTAMP=$(date -Iseconds)" >> "$GITHUB_ENV"

      - name: Commit changes if any
        uses: test-room-7/action-update-file@v2
        with:
          file-path: filtered.txt
          commit-msg: "Update lite_filter.txt - ${{ env.TIMESTAMP }}"
          github-token: ${{ secrets.GITHUB_TOKEN }}
